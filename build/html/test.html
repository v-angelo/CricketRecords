<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Records</title>
    <!-- css -->
    <link rel="stylesheet" href="../css/style.css" />
    <!-- favicon -->
    <link rel="icon" href="../img/favicon.ico" />
  </head>

  <body
    id="mainPage"
    class="min-h-screen dark:bg-slate-950 bg-slate-50 dark:text-white"
  >
    <!-- header -->
    <header class="bg-purple-600 dark:bg-purple-950 sticky top-0 z-10">
      <!-- navbar -->
      <nav
        class="flex flex-row lg:max-w-5xl mx-auto px-3 py-2 h-18 justify-between"
      >
        <!-- logo and title -->
        <a class="w-60 flex hover:opacity-90" href="../index.html">
          <img class="h-full" src="../img/logo.png" alt="logo" />
          <h3 class="flex items-center justify-center text-2xl font-semibold">
            Cricket Records
          </h3>
        </a>
        <!-- dark/light toggle -->
        <section
          class="flex justify-evenly items-center text-2xl font-semibold gap-4"
        >
          <div class="text-amber-500 hover:text-amber-600 cursor-pointer">
            <span class="sun"><i class="fa-regular fa-sun"></i></span>
            <span class="moon"><i class="fa-regular fa-moon"></i></span>
          </div>
          <!-- login -->
          <span class="cursor-pointer hover:opacity-90">Login</span>
        </section>
      </nav>
    </header>

    <!-- main -->
    <main>
      <!-- heading -->
      <h1 class="text-4xl md:text-5xl text-center font-bold my-5">
        Test Records
      </h1>

      <!-- batting section -->
      <section
        class="w-9/10 lg:max-w-5xl mx-auto overflow-x-auto pt-2 text-center"
      >
        <!-- batting table -->
        <article
          class="border dark:border-white/40 border-black/15 rounded-t-3xl inline-block text-left"
        >
          <table class="table-auto whitespace-nowrap" id="testBattingTable">
            <caption
              class="text-left text-xl font-semibold caption-top py-2 pl-2"
            >
              Top Batting Records
            </caption>
            <thead>
              <tr>
                <!-- column01 - ID -->
                <th data-key="">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      #
                    </button>
                    <div class="hoverTable">Index</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column02 - Player -->
                <th data-key="player">
                  <div class="relative group">
                    <button
                      class="cursor-pointer text-left w-full pl-2 py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      Player
                    </button>
                    <div class="hoverTable">Player Name</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column03 - Country -->
                <th data-key="nat">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      Nat
                    </button>
                    <div class="hoverTable">Nationality</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column04 - Career -->
                <th data-key="career">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      Career
                    </button>
                    <div class="hoverTable">Total Active Years</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column05 - Matches -->
                <th data-key="mat">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      Mat
                    </button>
                    <div class="hoverTable">Total Matches</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column06 - Innings -->
                <th data-key="inns">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      Inn
                    </button>
                    <div class="hoverTable">Total Innings</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column07 - Runs -->
                <th data-key="runs">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      Runs
                    </button>
                    <div class="hoverTable">Total Runs Scored</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column08 - Not Outs -->
                <th data-key="no">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      NO
                    </button>
                    <div class="hoverTable">Total Not Outs</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column09 - Highest Score -->
                <th data-key="hs">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      HS
                    </button>
                    <div class="hoverTable">Highest Score</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column10 - Average -->
                <th data-key="ave">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      Avg
                    </button>
                    <div class="hoverTable">Total Average</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column11 - Balls Faced -->
                <th data-key="bf">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      BF
                    </button>
                    <div class="hoverTable">Total Balls Faced</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column12 - Strike Rate -->
                <th data-key="sr">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      SR
                    </button>
                    <div class="hoverTable">Strike Rate</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column13 - 100s -->
                <th data-key="hundreds">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      100s
                    </button>
                    <div class="hoverTable">Total Centuries</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column14 - Innings -->
                <th data-key="fifties">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      50s
                    </button>
                    <div class="hoverTable">Total Half-Centuries</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column15 - Ducks -->
                <th data-key="ducks">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      0s
                    </button>
                    <div class="hoverTable">Total Ducks</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column16 - Fours -->
                <th data-key="fours">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      4s
                    </button>
                    <div class="hoverTable">Total Fours</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
                <!-- column17 - Sixes -->
                <th data-key="sixes">
                  <div class="relative group">
                    <button
                      class="cursor-pointer w-full py-2 dark:bg-purple-950 bg-purple-600"
                    >
                      6s
                    </button>
                    <div class="hoverTable">Total Sixes</div>
                    <div
                      class="triangle-down hoverTable bottom-8.5 w-4 h-4"
                    ></div>
                  </div>
                </th>
              </tr>
            </thead>
            <tbody>
              <!-- table data comes here -->
            </tbody>
          </table>
        </article>
      </section>

      <!-- editing section -->
      <section class="w-9/10 lg:max-w-225 mx-auto">
        <!-- editing buttons -->
        <article class="w-full flex justify-evenly my-5">
          <button
            id="addButton"
            class="bg-green-500 py-2 px-4 rounded-lg w-25 font-semibold cursor-pointer hover:opacity-85 active:ring-2"
          >
            Add
          </button>
          <button
            id="modifyButton"
            class="bg-yellow-500 py-2 px-4 rounded-lg w-25 font-semibold cursor-pointer hover:opacity-85 active:ring-2"
          >
            Modify
          </button>
          <button
            id="deleteButton"
            class="bg-red-600 py-2 px-4 rounded-lg w-25 font-semibold cursor-pointer hover:opacity-85 active:ring-2"
          >
            Delete
          </button>
        </article>

        <!-- add form -->
        <form
          class="px-1 py-2 my-7 w-full hidden flex-wrap items-center justify-center lg:gap-x-30 border dark:border-white/40 border-black/15 rounded-xl"
          id="batForm"
        >
          <div class="m-2 flex justify-between w-75">
            <!-- player -->
            <label class="text-lg" for="addPlayer">Player: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formPlayer"
              placeholder="Player Name"
              required
            />
          </div>
          <div class="m-2 flex justify-between w-75">
            <!-- country -->
            <label class="text-lg" for="addCountry">Nationality: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formCountry"
              placeholder="Nationality"
              required
            />
          </div>
          <div class="m-2 flex justify-between w-75">
            <!-- career -->
            <label class="text-lg" for="addCareer">Career: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formCareer"
              placeholder="Active Years"
              required
            />
          </div>
          <!-- matches -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="addMatches">Matches: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formMatches"
              placeholder="Total Matches"
              required
            />
          </div>
          <!-- innings -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="addInnings">Innings: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formInnings"
              placeholder="Total Innings"
              required
            />
          </div>
          <!-- runs -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="addRuns">Runs: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formRuns"
              placeholder="Total Runs"
              required
            />
          </div>
          <!-- not outs -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="addNO">Not Outs: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formNO"
              placeholder="Total Not Outs"
              required
            />
          </div>
          <!-- higest score -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="addHS">Highest: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formHS"
              placeholder="Highest Score"
              required
            />
          </div>
          <!-- average -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="addAvg">Average: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formAvg"
              placeholder="Average Score"
              required
            />
          </div>
          <!-- balls faced -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="addBF">Balls Faced: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formBF"
              placeholder="Balls Faced"
              required
            />
          </div>
          <!-- strike rate -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="addSR">Stike Rate: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formSR"
              placeholder="Strike Rate"
              required
            />
          </div>
          <!-- 100s -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="add100">Centuries: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="form100"
              placeholder="Centuries"
              required
            />
          </div>
          <!-- 50s -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="add50">Half-Cen: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="form50"
              placeholder="Half-Centuries"
              required
            />
          </div>
          <!-- ducks -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="addDucks">Ducks: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formDucks"
              placeholder="Total Ducks"
              required
            />
          </div>
          <!-- 4s -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="addFours">Fours: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formFours"
              placeholder="Total Fours"
              required
            />
          </div>
          <!-- 6s -->
          <div class="m-2 flex justify-between w-75">
            <label class="text-lg" for="addSixes">Sixes: </label>
            <input
              class="border dark:border-white/40 border-black/15 rounded py-1 px-2"
              type="text"
              id="formSixes"
              placeholder="Total Sixes"
              required
            />
          </div>
          <button
            type="button"
            class="bg-purple-600 dark:bg-purple-950 sm:mx-30 mx-5 mt-5 py-2 px-4 rounded-lg w-25 font-semibold cursor-pointer hover:opacity-85 active:ring-2"
          >
            Cancel
          </button>
          <button
            type="reset"
            class="bg-purple-600 dark:bg-purple-950 sm:mx-30 mx-5 mt-5 py-2 px-4 rounded-lg w-25 font-semibold cursor-pointer hover:opacity-85 active:ring-2"
          >
            Reset
          </button>
          <button
            type="submit"
            class="bg-amber-500 dark:bg-amber-600 sm:mx-30 mx-5 mt-5 py-2 px-4 rounded-lg w-25 font-semibold cursor-pointer hover:opacity-85 active:ring-2"
          >
            Submit
          </button>
        </form>
        <!-- modify form -->
      </section>
    </main>
  </body>
  <!-- fontawesome cdn -->
  <script
    src="https://kit.fontawesome.com/7e59fb41a7.js"
    crossorigin="anonymous"
  ></script>

  <!-- Light/Dark Theme JS -->
  <script src="../js/theme.js"></script>
  <!-- main js file -->
  <script type="module" src="../js/main.js"></script>
</html>
